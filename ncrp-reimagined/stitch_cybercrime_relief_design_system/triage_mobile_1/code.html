<style>
        .copper-shadow {
            box-shadow: 0 12px 40px rgba(196,107,50,0.12);
        }
        .poster-card {
            transition: all 0.2s ease-in-out;
        }
        .poster-card.selected {
            border-color: theme('colors.primary');
            background-color: theme('colors.surface-bright');
        }
        .poster-card:not(.selected) {
            border-color: theme('colors.secondary-fixed-dim');
        }
        .stamp-visible {
            opacity: 1;
            transform: scale(1);
        }
        .stamp-hidden {
            opacity: 0;
            transform: scale(0.8);
        }

</button>

</button>

<script>
        function toggleSelection(element) {
            element.classList.toggle('selected');
            const stamp = element.querySelector('div.absolute');
            if (element.classList.contains('selected')) {
                stamp.classList.remove('stamp-hidden');
                stamp.classList.add('stamp-visible');
                element.classList.add('copper-shadow');
            } else {
                stamp.classList.remove('stamp-visible');
                stamp.classList.add('stamp-hidden');
                element.classList.remove('copper-shadow');
            }
        }
    </script>
