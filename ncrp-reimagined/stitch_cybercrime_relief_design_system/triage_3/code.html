<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom Checkbox Styling */
        input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 1px solid var(--tw-prose-body); /* fallback */
            border-color: #C5D0DC; /* rule-border */
            display: grid;
            place-content: center;
        }

        input[type="checkbox"]::before {
            content: "";
            width: 0.8em;
            height: 0.8em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em var(--tw-prose-body);
            background-color: #0F6A6A; /* trust-teal */
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }
        
        input[type="checkbox"]:checked {
             border-color: #0F6A6A;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-paper-bg text-ink-text antialiased min-h-screen flex flex-col md:hidden">
<!-- Top Navigation (Transactional) -->
<header class="bg-paper-bg h-[64px] w-full flex items-center px-margin-mobile border-b border-rule-border shrink-0 fixed top-0 z-50">
<a class="flex items-center gap-2 text-ink-secondary hover:text-trust-teal transition-colors focus:outline-none focus:ring-2 focus:ring-trust-teal rounded p-1 -ml-1" href="#">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
<span class="font-button text-button">Back</span>
</a>
</header>
<!-- Main Content Area -->
<main class="flex-grow pt-[80px] px-margin-mobile pb-24 w-full max-w-sm mx-auto flex flex-col gap-6">
<!-- Stepper -->
<nav aria-label="Progress" class="w-full">
<ol class="flex items-center gap-2" role="list">
<li class="relative">
<span class="flex h-8 w-8 items-center justify-center rounded border border-rule-border bg-surface text-ink-secondary font-label-mono text-label-mono">1</span>
</li>
<li class="flex-1 border-t border-rule-border"></li>
<li class="relative">
<span aria-current="step" class="flex h-8 w-8 items-center justify-center rounded border-2 border-trust-teal bg-paper-bg text-trust-teal font-label-mono text-label-mono font-bold">2</span>
</li>
<li class="flex-1 border-t border-rule-border"></li>
<li class="relative">
<span class="flex h-8 w-8 items-center justify-center rounded border border-rule-border bg-surface text-ink-secondary font-label-mono text-label-mono">3</span>
</li>
<li class="flex-1 border-t border-rule-border"></li>
<li class="relative">
<span class="flex h-8 w-8 items-center justify-center rounded border border-rule-border bg-surface text-ink-secondary font-label-mono text-label-mono">4</span>
</li>
</ol>
</nav>
<!-- Header -->
<div class="flex flex-col gap-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-ink-text">What has already happened?</h1>
<p class="font-body-md text-body-md text-ink-secondary">Pick every row that is true to help us prioritize your case.</p>
</div>
<!-- Checklist Form -->
<form action="#" class="flex flex-col gap-3" method="POST">
<!-- Row 1 -->
<label class="flex items-start gap-4 p-4 border border-rule-border bg-surface rounded hover:bg-surface-variant/50 transition-colors cursor-pointer has-[:checked]:border-trust-teal has-[:checked]:bg-paper-bg">
<input class="mt-1 rounded border-rule-border text-trust-teal focus:ring-trust-teal" name="incident_type" type="checkbox" value="money"/>
<div class="flex flex-col">
<span class="font-body-md text-body-md font-semibold text-ink-text">Money left my account</span>
<span class="font-body-md text-body-md text-ink-secondary text-sm">Transfers, card charges, or UPI.</span>
</div>
</label>
<!-- Row 2 -->
<label class="flex items-start gap-4 p-4 border border-rule-border bg-surface rounded hover:bg-surface-variant/50 transition-colors cursor-pointer has-[:checked]:border-trust-teal has-[:checked]:bg-paper-bg">
<input class="mt-1 rounded border-rule-border text-trust-teal focus:ring-trust-teal" name="incident_type" type="checkbox" value="media"/>
<div class="flex flex-col">
<span class="font-body-md text-body-md font-semibold text-ink-text">They have photos or videos</span>
<span class="font-body-md text-body-md text-ink-secondary text-sm">Personal, intimate, or fabricated content.</span>
</div>
</label>
<!-- Row 3 -->
<label class="flex items-start gap-4 p-4 border border-rule-border bg-surface rounded hover:bg-surface-variant/50 transition-colors cursor-pointer has-[:checked]:border-trust-teal has-[:checked]:bg-paper-bg">
<input class="mt-1 rounded border-rule-border text-trust-teal focus:ring-trust-teal" name="incident_type" type="checkbox" value="device"/>
<div class="flex flex-col">
<span class="font-body-md text-body-md font-semibold text-ink-text">They can get into my phone</span>
<span class="font-body-md text-body-md text-ink-secondary text-sm">Remote access, compromised passwords.</span>
</div>
</label>
<!-- Row 4 -->
<label class="flex items-start gap-4 p-4 border border-rule-border bg-surface rounded hover:bg-surface-variant/50 transition-colors cursor-pointer has-[:checked]:border-trust-teal has-[:checked]:bg-paper-bg">
<input class="mt-1 rounded border-rule-border text-trust-teal focus:ring-trust-teal" name="incident_type" type="checkbox" value="identity"/>
<div class="flex flex-col">
<span class="font-body-md text-body-md font-semibold text-ink-text">They have my Aadhaar</span>
<span class="font-body-md text-body-md text-ink-secondary text-sm">Or other official identification documents.</span>
</div>
</label>
<!-- Row 5 -->
<label class="flex items-start gap-4 p-4 border border-rule-border bg-surface rounded hover:bg-surface-variant/50 transition-colors cursor-pointer has-[:checked]:border-trust-teal has-[:checked]:bg-paper-bg">
<input class="mt-1 rounded border-rule-border text-trust-teal focus:ring-trust-teal" name="incident_type" type="checkbox" value="threat"/>
<div class="flex flex-col">
<span class="font-body-md text-body-md font-semibold text-ink-text">They threatened me</span>
<span class="font-body-md text-body-md text-ink-secondary text-sm">Blackmail, physical harm, or public exposure.</span>
</div>
</label>
<!-- Row 6 (Exclusive) -->
<label class="flex items-start gap-4 p-4 border border-rule-border bg-surface rounded hover:bg-surface-variant/50 transition-colors cursor-pointer has-[:checked]:border-trust-teal has-[:checked]:bg-paper-bg mt-2">
<input class="mt-1 rounded border-rule-border text-trust-teal focus:ring-trust-teal" id="checkbox-none" name="incident_type" type="checkbox" value="none"/>
<div class="flex flex-col">
<span class="font-body-md text-body-md font-semibold text-ink-text">None of this</span>
<span class="font-body-md text-body-md text-ink-secondary text-sm">Clear selection.</span>
</div>
</label>
</form>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-paper-bg border-t border-rule-border z-40 flex flex-col gap-2">
<button class="w-full bg-trust-teal text-on-primary font-button text-button py-3 px-4 rounded flex items-center justify-start focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-trust-teal transition-transform active:scale-95" type="button">
            Continue
        </button>
<p class="font-label-mono text-label-mono text-ink-secondary text-center">You can change this in a minute.</p>
</div>
<!-- Quick Exit FAB (Contextual suppression overridden by safety requirement, usually top right, placing it high z-index) -->
<button aria-label="Quick Exit" class="fixed top-[12px] right-margin-mobile z-[60] bg-postal-vermilion text-on-primary font-button text-button py-2 px-4 rounded border border-rule-border focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-postal-vermilion hover:bg-error transition-colors shadow-none">
        LEAVE NOW
    </button>
<script>
        // Simple logic to handle the "None of this" exclusive checkbox
        document.addEventListener('DOMContentLoaded', () => {
            const noneCheckbox = document.getElementById('checkbox-none');
            const otherCheckboxes = document.querySelectorAll('input[name="incident_type"]:not([value="none"])');

            noneCheckbox.addEventListener('change', (e) => {
                if (e.target.checked) {
                    otherCheckboxes.forEach(cb => {
                        cb.checked = false;
                    });
                }
            });

            otherCheckboxes.forEach(cb => {
                cb.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        noneCheckbox.checked = false;
                    }
                });
            });
        });
    </script>
</body></html>
