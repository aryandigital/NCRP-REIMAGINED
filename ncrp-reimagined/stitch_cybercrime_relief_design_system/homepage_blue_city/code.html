<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Copper Shadow for Cards */
        .copper-shadow {
            box-shadow: 0 12px 40px rgba(196,107,50,0.12);
        }
        
        /* 2px Indigo Outline */
        .indigo-outline {
            border: 2px solid #272e4f; /* inverse-surface */
        }
        
        /* Interactive Card Hover */
        .door-card:hover .door-icon {
            transform: translateY(-4px);
            transition: transform 0.3s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-main antialiased min-h-screen flex flex-col pt-20 pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 bg-surface dark:bg-inverse-surface border-b-2 border-outline-variant dark:border-outline flat no shadows">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary">NCRP Cyber Response</span>
</div>
<button class="bg-error-container text-on-error-container px-4 py-2 rounded-lg font-label-mono text-label-mono font-bold hover:bg-error/20 transition-colors">
            Quick Exit
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col gap-unit">
<!-- Hero Section / Universal Check Bar -->
<section class="px-margin-mobile pt-12 pb-8 flex flex-col gap-6">
<div class="flex flex-col gap-2">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">Something arrived that does not feel right.</h1>
<p class="font-body-main text-body-main text-on-surface-variant">Show us the message. We will tell you what to do.</p>
</div>
<div class="bg-surface border-2 border-primary-container rounded-xl p-2 flex flex-col gap-4 shadow-sm focus-within:border-tertiary-container transition-colors">
<div class="flex flex-col gap-1 px-2 pt-2">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase">Check a message, link, or number</label>
<textarea class="w-full bg-transparent border-none focus:ring-0 resize-none font-body-main text-body-main text-on-surface p-0 placeholder-on-surface-variant/50" placeholder="Paste the suspicious content here..." rows="3"></textarea>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-label-mono text-label-mono py-4 rounded-lg flex justify-center items-center gap-2 hover:bg-primary transition-colors">
<span class="material-symbols-outlined fill">check_circle</span>
                    Check this
                </button>
</div>
</section>
<!-- Situation Doors -->
<section class="px-margin-mobile flex flex-col gap-6 pb-12">
<!-- Door 1: Active Threat -->
<button class="door-card bg-error-container text-on-error-container rounded-xl p-6 text-left flex flex-col gap-4 indigo-outline copper-shadow relative overflow-hidden group">
<div class="absolute -right-4 -bottom-4 opacity-20 pointer-events-none transition-transform group-hover:scale-110 duration-500">
<img class="w-32 h-32 object-contain mix-blend-multiply" data-alt="A stylized, flat color illustration of a glowing smartphone screen displaying a warning message. The design uses 2px indigo dye outlines and vibrant vermilion accents on a modern light-mode background, fitting a high-stakes, professional cyber response control center aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDlp2gDbftLoLp8PdGrynOgicMboWdG02-qdIaZSjpP3ECODWJ_C-i6Rk1YH27SwZnD62HOZ5l0PbvGfys-3GL4xb19zsmYBH9Y7JARvL2wZx-zaL6-vQQZ9Wpf_iKID0pYzRHkL4jwt0EwytLZIttNsWhrbcQ41HmZcn9klDCSFFE7U0tY4uOXUxcieSpK_7er1SArCksnFS3EZHvycxxN_9zpydgvBsR47pkk_W4kv0gcUC4M7P3bjA"/>
</div>
<div class="flex items-center gap-3 door-icon transition-transform">
<div class="w-12 h-12 rounded-full bg-error text-on-error flex items-center justify-center">
<span class="material-symbols-outlined fill text-2xl">warning</span>
</div>
<span class="font-label-mono text-label-mono uppercase tracking-wider font-bold">Urgent</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md font-bold mb-2">Something is happening right now</h2>
<p class="font-body-main text-body-main opacity-90">Active calls, ongoing threats, or someone currently in your device.</p>
</div>
</button>
<!-- Door 2: Containment -->
<button class="door-card bg-surface-container-high text-on-surface rounded-xl p-6 text-left flex flex-col gap-4 indigo-outline shadow-sm relative overflow-hidden group">
<div class="flex items-center gap-3 door-icon transition-transform">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined fill text-2xl">account_balance_wallet</span>
</div>
</div>
<div>
<h2 class="font-headline-md text-headline-md font-bold text-lg leading-tight mb-2">Money, an account, or a photo is already gone</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Take immediate steps to contain the damage.</p>
</div>
</button>
<!-- Door 3: Uncertainty -->
<button class="door-card bg-surface-container border-2 border-secondary rounded-xl p-6 text-left flex flex-col gap-4 shadow-sm relative overflow-hidden group">
<div class="flex items-center gap-3 door-icon transition-transform">
<div class="w-12 h-12 rounded-full border-2 border-secondary text-secondary flex items-center justify-center">
<span class="material-symbols-outlined text-2xl">help_outline</span>
</div>
</div>
<div>
<h2 class="font-headline-md text-headline-md font-bold text-lg leading-tight mb-2 text-secondary">I am not sure if this is a scam</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Review common patterns to verify your situation.</p>
</div>
</button>
</section>
<div class="px-margin-mobile pb-8">
<button class="w-full border-2 border-outline text-on-surface-variant font-label-mono text-label-mono py-4 rounded-lg flex justify-center items-center gap-2 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">phone</span>
                    Call Helpline 1930
                </button>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 bg-surface dark:bg-inverse-surface border-t-2 border-outline-variant dark:border-outline shadow-[0_-12px_40px_rgba(196,107,50,0.12)] rounded-t-xl">
<!-- Active Tab: Check -->
<button class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-[12px] px-4 py-1 scale-95 transition-transform duration-150">
<span class="material-symbols-outlined fill">verified_user</span>
<span class="font-label-mono text-label-mono text-[10px]">Check</span>
</button>
<!-- Inactive Tabs -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 hover:bg-primary-container/20 dark:hover:bg-primary-container/30 rounded-[12px]">
<span class="material-symbols-outlined">bolt</span>
<span class="font-label-mono text-label-mono text-[10px]">Act</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 hover:bg-primary-container/20 dark:hover:bg-primary-container/30 rounded-[12px]">
<span class="material-symbols-outlined">report_problem</span>
<span class="font-label-mono text-label-mono text-[10px]">Report</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 hover:bg-primary-container/20 dark:hover:bg-primary-container/30 rounded-[12px]">
<span class="material-symbols-outlined">health_and_safety</span>
<span class="font-label-mono text-label-mono text-[10px]">Recover</span>
</button>
</nav>
