<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tick-item {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .tick-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-paper-bg text-ink-text flex flex-col min-h-screen font-body-md antialiased selection:bg-trust-teal selection:text-white">
<!-- TopAppBar (From JSON) -->
<header class="bg-paper-bg dark:bg-inverse-surface border-b border-rule-border flex justify-between items-center w-full px-margin-mobile h-16 transition-colors duration-200">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="g_translate">g_translate</span>
<span class="font-headline-md text-headline-md text-ink-text dark:text-surface-bright hidden md:block">The Citizen’s Desk</span>
</div>
<button class="text-postal-vermilion font-bold font-button text-button hover:bg-surface-container-high px-4 py-2 rounded transition-colors duration-200 flex items-center gap-2">
<span>Quick Exit</span>
<span class="material-symbols-outlined" data-icon="exit_to_app">exit_to_app</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-[1120px] mx-auto px-margin-mobile md:px-margin-desktop py-12 flex flex-col">
<!-- Journey Indicator -->
<nav aria-label="Progress" class="mb-12">
<ol class="flex items-center" role="list">
<li class="relative pr-8 sm:pr-20">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="h-px w-full bg-trust-teal"></div>
</div>
<a class="relative flex h-8 w-8 items-center justify-center bg-paper-bg border border-trust-teal rounded-full hover:bg-surface-container-low transition-colors duration-150" href="#">
<span class="material-symbols-outlined text-trust-teal text-sm" data-icon="check">check</span>
</a>
</li>
<li class="relative pr-8 sm:pr-20">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="h-px w-full bg-rule-border"></div>
</div>
<a aria-current="step" class="relative flex h-8 w-8 items-center justify-center bg-trust-teal border border-trust-teal rounded-full" href="#">
<span class="font-label-mono text-label-mono text-white text-xs">2</span>
</a>
</li>
<li class="relative">
<a class="relative flex h-8 w-8 items-center justify-center bg-paper-bg border border-rule-border rounded-full" href="#">
<span class="font-label-mono text-label-mono text-ink-secondary text-xs">3</span>
</a>
</li>
</ol>
<p class="mt-4 font-label-mono text-label-mono text-ink-secondary">Step 2: Evidence Processing</p>
</nav>
<!-- Loading Area -->
<div class="flex-grow flex flex-col justify-center max-w-2xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-ink-text mb-12">
                Analyzing your submission
            </h1>
<div class="bg-surface border border-rule-border p-8 rounded min-h-[240px] flex flex-col justify-center relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-surface-container-highest">
<div class="h-full bg-trust-teal w-1/3 animate-[pulse_2s_ease-in-out_infinite]" style="animation: slide 3s infinite linear; position: relative;"></div>
</div>
<style>
                    @keyframes slide {
                        0% { left: -33%; }
                        100% { left: 100%; }
                    }
                </style>
<ul class="space-y-[24px] font-label-mono text-[15px] leading-tight text-ink-text" id="loading-list">
<li class="flex items-center gap-4 tick-item">
<span class="material-symbols-outlined text-trust-teal" data-icon="check">check</span>
<span>Hiding your personal numbers</span>
</li>
<li class="flex items-center gap-4 tick-item">
<span class="material-symbols-outlined text-trust-teal" data-icon="check">check</span>
<span>Matching the script</span>
</li>
<li class="flex items-center gap-4 tick-item">
<span class="material-symbols-outlined text-trust-teal" data-icon="check">check</span>
<span>Working out what they ask for next</span>
</li>
</ul>
</div>
</div>

</div>
</div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const items = document.querySelectorAll('.tick-item');
            
            items.forEach((item, index) => {
                setTimeout(() => {
                    item.classList.add('visible');
                }, 800 * (index + 1));
            });
        });
    </script>
