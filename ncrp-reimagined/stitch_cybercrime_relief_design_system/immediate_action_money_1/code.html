<!DOCTYPE html>

<title>Immediate Action Mode</title>

                      "secondary-fixed-dim": "#b2c8ed",
                      "tertiary-fixed-dim": "#ffb694",
                      "on-secondary": "#ffffff",
                      "on-primary-fixed": "#002020",
                      "secondary-fixed": "#d4e3ff",
                      "surface": "#F7F9FC",
                      "clock-amber": "#B45309",
                      "surface-container": "#eaeef2",
                      "secondary": "#4a5f7f",
                      "primary-fixed": "#a3f0ef",
                      "error-container": "#ffdad6",
                      "on-primary-container": "#9be7e6",
                      "on-secondary-fixed-variant": "#324866",
                      "on-secondary-fixed": "#021c39",
                      "on-tertiary": "#ffffff",

                      "error": "#ba1a1a",
                      "on-surface-variant": "#3f4948",
                      "tertiary-fixed": "#ffdbcc",
                      "primary": "#005050"

              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",

              "spacing": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-paper-bg text-on-background antialiased min-h-screen flex flex-col items-center">
<!-- Mobile Container (Max Width 390px for preview, acts as a constrained wrapper) -->
<div class="w-full max-w-[390px] h-[884px] bg-surface flex flex-col relative overflow-hidden shadow-2xl mx-auto border-x border-rule-border">
<!-- Special Chrome Top -->
<div class="flex justify-between items-center px-margin-mobile pt-4 pb-2 border-b border-rule-border bg-paper-bg z-50">
<a class="flex items-center gap-2 text-trust-teal" href="tel:1930">
<span class="material-symbols-outlined font-variation-settings-'FILL'-1 text-2xl">call</span>
<span class="font-button text-button">Call 1930</span>
</a>
<button class="bg-postal-vermilion text-on-error px-4 py-2 rounded font-button text-button">LEAVE NOW</button>
</div>
<div class="px-margin-mobile py-2 bg-surface-variant/30 text-center border-b border-rule-border">
<p class="font-label-mono text-label-mono text-ink-secondary">Do this now. One step at a time.</p>
</div>
<!-- Main Content Canvas (Scrollable) -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-gutter pb-32 flex flex-col gap-gutter">
<header>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-ink-text leading-tight mb-2">
                    Call your bank freeze line, then call 1930.
                </h1>
<p class="font-body-md text-body-md text-ink-secondary">Time is critical. Stop the money flow first.</p>
</header>
<!-- Giant Action Blocks -->
<div class="flex flex-col gap-4">
<a class="block w-full border border-rule-border bg-surface p-6 rounded-lg text-center hover:bg-surface-variant transition-colors flex flex-col items-center justify-center gap-3" href="tel:1930">
<span class="material-symbols-outlined text-[48px] text-trust-teal" style="font-variation-settings: 'FILL' 0;">support_agent</span>
<div>
<span class="font-button text-button text-ink-text block">Call 1930 Cyber Helpline</span>
<span class="font-label-mono text-label-mono text-ink-secondary mt-1">24/7 National Support</span>
</div>
</a>
<div class="block w-full border border-rule-border bg-surface p-6 rounded-lg hover:bg-surface-variant transition-colors flex flex-col items-center justify-center gap-3 cursor-pointer">
<span class="material-symbols-outlined text-[48px] text-ink-text" style="font-variation-settings: 'FILL' 0;">account_balance</span>
<div class="text-center w-full">
<span class="font-button text-button text-ink-text block mb-2">Call Your Bank</span>
<select class="w-full bg-paper-bg border-rule-border rounded font-body-md text-body-md text-ink-text p-2 focus:ring-2 focus:ring-trust-teal focus:border-trust-teal">
<option>Select Bank to find number...</option>
<option>State Bank of India (1800 1234)</option>
<option>HDFC Bank (1800 202 6161)</option>
<option>ICICI Bank (1800 1080)</option>
</select>
</div>
</div>
</div>
<!-- Confirmation Section -->
<div class="mt-4 p-4 border border-rule-border bg-surface-bright rounded-lg flex flex-col gap-4">
<label class="flex items-start gap-3 cursor-pointer group">
<input class="mt-1 w-5 h-5 border-rule-border text-trust-teal focus:ring-trust-teal rounded-sm bg-paper-bg" type="checkbox"/>
<span class="font-body-md text-body-md text-ink-text group-hover:text-trust-teal transition-colors">I have made both calls and informed them about the transaction.</span>
</label>
<button class="w-full bg-trust-teal text-on-primary py-3 rounded font-button text-button disabled:opacity-50 disabled:cursor-not-allowed text-left pl-4" disabled="" id="proceedBtn">
                    Build complaint from this
                </button>
</div>
</main>
<!-- Bottom Tabs (Fixed) -->
<nav class="absolute bottom-0 left-0 right-0 bg-paper-bg border-t border-rule-border flex h-16 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50">
<!-- Active Tab -->
<button class="flex-1 flex flex-col items-center justify-center gap-1 text-trust-teal border-t-2 border-trust-teal bg-secondary-container/20">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">currency_rupee</span>
<span class="font-label-mono text-[10px] uppercase tracking-wider font-bold">Money</span>
</button>
<!-- Inactive Tabs -->
<button class="flex-1 flex flex-col items-center justify-center gap-1 text-ink-secondary hover:bg-surface-variant/30 transition-colors">
<span class="material-symbols-outlined text-xl">image</span>
<span class="font-label-mono text-[10px] uppercase tracking-wider">Photos</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center gap-1 text-ink-secondary hover:bg-surface-variant/30 transition-colors">
<span class="material-symbols-outlined text-xl">lock_open</span>
<span class="font-label-mono text-[10px] uppercase tracking-wider">Access</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center gap-1 text-ink-secondary hover:bg-surface-variant/30 transition-colors">
<span class="material-symbols-outlined text-xl">badge</span>
<span class="font-label-mono text-[10px] uppercase tracking-wider">Identity</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center gap-1 text-ink-secondary hover:bg-surface-variant/30 transition-colors">
<span class="material-symbols-outlined text-xl">health_and_safety</span>
<span class="font-label-mono text-[10px] uppercase tracking-wider">Safety</span>
</button>
</nav>
</div>
<script>
        // Simple interaction for the checkbox to enable the button
        const checkbox = document.querySelector('input[type="checkbox"]');
        const btn = document.getElementById('proceedBtn');
        
        if(checkbox && btn) {
            checkbox.addEventListener('change', (e) => {
                btn.disabled = !e.target.checked;
            });
        }
    </script>
</body></html>
