<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report Wizard - Q1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=Lexend:wght@400;600&amp;family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#c2d8fe",
                        "on-tertiary-container": "#ffcfbb",
                        "ink-text": "#0F2744",
                        "inverse-surface": "#2c3134",
                        "outline-variant": "#bec9c8",
                        "primary-container": "#0f6a6a",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#351000",
                        "surface-bright": "#f6fafe",
                        "paper-bg": "#EEF2F6",
                        "surface-variant": "#dfe3e7",
                        "background": "#f6fafe",
                        "outline": "#6f7979",
                        "ink-secondary": "#3D5166",
                        "on-secondary-container": "#495e7e",
                        "surface-container-highest": "#dfe3e7",
                        "on-tertiary-fixed-variant": "#6f381c",
                        "on-surface": "#171c1f",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f0f4f8",
                        "inverse-on-surface": "#edf1f5",
                        "on-primary-fixed-variant": "#004f50",
                        "tertiary-container": "#8c4f31",
                        "surface-container-high": "#e5e9ed",
                        "trust-teal": "#0F6A6A",
                        "postal-vermilion": "#C2410C",
                        "secondary-fixed-dim": "#b2c8ed",
                        "tertiary-fixed-dim": "#ffb694",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#002020",
                        "secondary-fixed": "#d4e3ff",
                        "surface": "#F7F9FC",
                        "clock-amber": "#B45309",
                        "surface-container": "#eaeef2",
                        "secondary": "#4a5f7f",
                        "primary-fixed": "#a3f0ef",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#9be7e6",
                        "on-secondary-fixed-variant": "#324866",
                        "on-secondary-fixed": "#021c39",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#87d3d3",
                        "rule-border": "#C5D0DC",
                        "surface-tint": "#0d6969",
                        "surface-dim": "#d6dade",
                        "on-background": "#171c1f",
                        "on-error": "#ffffff",
                        "tertiary": "#6f381c",
                        "inverse-primary": "#87d3d3",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#3f4948",
                        "tertiary-fixed": "#ffdbcc",
                        "primary": "#005050"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "unit": "8px",
                        "max-width": "1120px"
                    },
                    "fontFamily": {
                        "body-lg": ["Lexend"],
                        "headline-md": ["\"Source Serif 4\""],
                        "button": ["Lexend"],
                        "headline-lg-mobile": ["\"Source Serif 4\""],
                        "headline-lg": ["\"Source Serif 4\""],
                        "label-mono": ["IBM Plex Mono"],
                        "body-md": ["Lexend"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "button": ["16px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "headline-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-mono": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: theme('colors.paper-bg');
            color: theme('colors.ink-text');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col items-center p-margin-mobile md:p-margin-desktop">
<!-- Top App Bar (Modified for transactional context: Quick Exit only) -->
<header class="w-full max-w-[390px] h-[64px] flex justify-between items-center mb-8 border-b border-rule-border">
<a class="flex items-center gap-2 text-trust-teal hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="arrow_back" data-weight="fill" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
<span class="font-button text-button">Back</span>
</a>
<button aria-label="Quick Exit" class="bg-postal-vermilion text-on-primary font-button text-button px-4 py-2 rounded flex items-center gap-2 hover:bg-error transition-colors shadow-none border border-transparent focus:ring-2 focus:ring-offset-2 focus:ring-postal-vermilion outline-none">
            LEAVE NOW
        </button>
</header>
<main class="w-full max-w-[390px] flex-1 flex flex-col gap-6">
<!-- Stepper -->
<div class="font-label-mono text-label-mono text-ink-secondary flex items-center gap-2 pb-4 border-b border-rule-border">
<span class="text-trust-teal font-bold">Report</span>
<span>·</span>
<span>Question 1 of 7</span>
</div>
<!-- Content -->
<div class="flex flex-col gap-8 flex-1">
<div class="flex flex-col gap-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-ink-text md:font-headline-lg md:text-headline-lg">What should we call you?</h1>
<p class="font-body-md text-body-md text-ink-secondary">This can be a first name, an alias, or initials. We will use this to refer to you in the system.</p>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-6 flex-1">
<div class="flex flex-col gap-2">
<label class="sr-only font-button text-button" for="nickname">Your Name or Alias</label>
<input class="w-full bg-surface border border-rule-border rounded p-4 font-label-mono text-label-mono text-ink-text focus:outline-none focus:border-trust-teal focus:border-2 transition-colors placeholder:text-outline-variant shadow-none" id="nickname" name="nickname" placeholder="Enter name or alias" type="text"/>
</div>
<div class="flex flex-col gap-4 py-4 border-t border-rule-border mt-2">
<label class="flex items-start gap-3 cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5 mt-0.5">
<input class="peer sr-only" name="anonymity" type="radio" value="no_name"/>
<div class="w-5 h-5 border border-rule-border rounded-full peer-checked:border-trust-teal peer-checked:border-2 peer-focus-visible:ring-2 peer-focus-visible:ring-trust-teal peer-focus-visible:ring-offset-2 transition-all"></div>
<div class="absolute w-2.5 h-2.5 bg-trust-teal rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-body-md text-body-md text-ink-text group-hover:text-trust-teal transition-colors">I do not want to give a name</span>
</label>
<label class="flex items-start gap-3 cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5 mt-0.5">
<input class="peer sr-only" name="anonymity" type="radio" value="anonymous"/>
<div class="w-5 h-5 border border-rule-border rounded-full peer-checked:border-trust-teal peer-checked:border-2 peer-focus-visible:ring-2 peer-focus-visible:ring-trust-teal peer-focus-visible:ring-offset-2 transition-all"></div>
<div class="absolute w-2.5 h-2.5 bg-trust-teal rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-body-md text-body-md text-ink-text group-hover:text-trust-teal transition-colors">File this anonymously</span>
</label>
</div>
<!-- Spacer to push actions to bottom if needed, though flex-1 on container handles it somewhat -->
<div class="mt-auto pt-8 border-t border-rule-border">
<button class="w-full bg-trust-teal text-on-primary font-button text-button py-4 rounded text-center hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-trust-teal shadow-none" type="submit">
                        Continue
                    </button>
<div class="flex items-center justify-center gap-1 mt-4 text-ink-secondary">
<span class="material-symbols-outlined text-[16px]" data-icon="save" data-weight="fill" style="font-variation-settings: 'FILL' 1;">save</span>
<span class="font-label-mono text-label-mono text-[12px]">Saved on this phone</span>
</div>
</div>
</form>
</div>
</main>
</body></html>
