<style>
        /* Custom Checkbox Styling for Govt-Spec Theme */
        .govt-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 1px solid #1C2420; /* Ink color substitute (using close approximation from prompt description) */
            border-radius: 0;
            background-color: #f3fcf5; /* surface */
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }
        .govt-checkbox:checked {
            background-color: #f3fcf5;
        }
        .govt-checkbox:checked::after {
            content: "X";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: "IBM Plex Mono", monospace;
            font-size: 20px;
            font-weight: 600;
            color: #b02e10; /* secondary/Vermilion */
        }
        
        /* Speed-Post Accent */
        .speed-post-accent {
            position: relative;
        }
        .speed-post-accent::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: repeating-linear-gradient(
                45deg,
                #b02e10,
                #b02e10 10px,
                #f3fcf5 10px,
                #f3fcf5 20px
            );
            z-index: 10;
        }
        
        /* Flat Button Shadow */
        .btn-govt {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-govt:hover {
            transform: translate(-2px, -2px);
            box-shadow: 2px 2px 0px 0px #1C2420;
        }
        .btn-govt:active {
            transform: translate(0, 0);
            box-shadow: 0px 0px 0px 0px #1C2420;
        }
        
        /* Hide nav shell completely as per rules for transactional/linear screens */
    </style>

<body class="bg-background min-h-screen text-on-background flex flex-col font-body-md text-body-md antialiased overflow-x-hidden selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- Top Speed-Post Accent for high-priority transactional container -->
<div class="speed-post-accent w-full h-1"></div>
<main class="flex-1 w-full max-w-[390px] mx-auto px-margin-mobile pt-8 pb-12 flex flex-col">
<!-- Back Link & Journey Marker -->
<div class="flex items-center justify-between mb-8">
<button class="flex items-center gap-2 text-secondary font-label-mono text-label-mono uppercase hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
<span>BACK</span>
</button>
<div class="bg-surface-container border border-on-surface/15 px-3 py-1 flex items-center gap-2">
<span class="w-2 h-2 rounded-none bg-secondary animate-pulse"></span>
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase">STEP: ACT</span>
</div>
</div>
<!-- Header -->
<header class="mb-6">
<div class="inline-flex items-center gap-2 mb-4 bg-surface-container-low border border-on-surface/15 px-2 py-1">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="font-serial-number text-serial-number text-secondary uppercase tracking-widest">REF: TR-01</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-background mb-4">What has already happened?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Tick everything that is true. This decides the order of your next steps.</p>
</header>
<!-- Form Area (Level -1 Well concept) -->
<form class="flex flex-col gap-unit mb-8" id="triage-form">
<!-- Well Container -->
<div class="bg-[#EFE8D8] p-4 border border-on-surface/15 flex flex-col gap-4">
<!-- Choice 1 -->
<label class="flex items-start gap-4 p-4 bg-surface border border-on-surface/15 cursor-pointer hover:bg-surface-container-low transition-colors group relative overflow-hidden">
<!-- Perforation top right -->
<div class="absolute -top-1 -right-1 w-4 h-4 bg-[#EFE8D8] border border-on-surface/15 rounded-full z-10"></div>
<input class="govt-checkbox mt-1" name="incident_type" type="checkbox" value="money_left"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-secondary transition-colors">Money left my account without my permission</span>
</label>
<!-- Choice 2 -->
<label class="flex items-start gap-4 p-4 bg-surface border border-on-surface/15 cursor-pointer hover:bg-surface-container-low transition-colors group relative overflow-hidden">
<div class="absolute -top-1 -right-1 w-4 h-4 bg-[#EFE8D8] border border-on-surface/15 rounded-full z-10"></div>
<input class="govt-checkbox mt-1" name="incident_type" type="checkbox" value="photos_videos"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-secondary transition-colors">They have photos/videos of me and are threatening</span>
</label>
<!-- Choice 3 -->
<label class="flex items-start gap-4 p-4 bg-surface border border-on-surface/15 cursor-pointer hover:bg-surface-container-low transition-colors group relative overflow-hidden">
<div class="absolute -top-1 -right-1 w-4 h-4 bg-[#EFE8D8] border border-on-surface/15 rounded-full z-10"></div>
<input class="govt-checkbox mt-1" name="incident_type" type="checkbox" value="phone_access"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-secondary transition-colors">They can get into my phone or computer right now</span>
</label>
<!-- Choice 4 -->
<label class="flex items-start gap-4 p-4 bg-surface border border-on-surface/15 cursor-pointer hover:bg-surface-container-low transition-colors group relative overflow-hidden">
<div class="absolute -top-1 -right-1 w-4 h-4 bg-[#EFE8D8] border border-on-surface/15 rounded-full z-10"></div>
<input class="govt-checkbox mt-1" name="incident_type" type="checkbox" value="identity_docs"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-secondary transition-colors">They have my Aadhaar/PAN/SIM details</span>
</label>
<!-- Choice 5 -->
<label class="flex items-start gap-4 p-4 bg-surface border border-on-surface/15 cursor-pointer hover:bg-surface-container-low transition-colors group relative overflow-hidden">
<div class="absolute -top-1 -right-1 w-4 h-4 bg-[#EFE8D8] border border-on-surface/15 rounded-full z-10"></div>
<input class="govt-checkbox mt-1" name="incident_type" type="checkbox" value="threatened"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-secondary transition-colors">They threatened me or my family physically</span>
</label>
<!-- Choice 6 (Exclusive) -->
<div class="relative py-2">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-dashed border-on-surface/30"></div>
</div>
<div class="relative flex justify-center">
<span class="bg-[#EFE8D8] px-2 font-label-mono text-label-mono text-on-surface-variant uppercase text-xs">OR</span>
</div>
</div>
<label class="flex items-start gap-4 p-4 bg-surface border border-on-surface/15 cursor-pointer hover:bg-surface-container-low transition-colors group relative overflow-hidden opacity-90">
<div class="absolute -top-1 -right-1 w-4 h-4 bg-[#EFE8D8] border border-on-surface/15 rounded-full z-10"></div>
<input class="govt-checkbox mt-1" id="none-checkbox" name="incident_type" type="checkbox" value="none_stopped"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-secondary transition-colors">None of this — I stopped in time</span>
</label>
</div>
</form>
<!-- Action Area -->
<div class="mt-auto pt-6 flex flex-col gap-4">
<button class="btn-govt w-full bg-secondary text-on-secondary font-label-mono text-label-mono uppercase py-4 border border-[#1C2420] flex items-center justify-center gap-2" type="button">
<span>Continue</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<div class="flex items-center justify-center gap-2 text-on-surface-variant/70">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">save</span>
<p class="font-label-mono text-[12px] uppercase tracking-wider">Saved on this phone. You can change it later.</p>
</div>
</div>
</main>
<script>
        // Simple logic to handle exclusive 'None of this' checkbox
        document.addEventListener('DOMContentLoaded', () => {
            const noneCheckbox = document.getElementById('none-checkbox');
            const otherCheckboxes = document.querySelectorAll('input[type="checkbox"]:not(#none-checkbox)');

            noneCheckbox.addEventListener('change', (e) => {
                if(e.target.checked) {
                    otherCheckboxes.forEach(cb => {
                        cb.checked = false;
                    });
                }
            });

            otherCheckboxes.forEach(cb => {
                cb.addEventListener('change', (e) => {
                    if(e.target.checked) {
                        noneCheckbox.checked = false;
                    }
                });
            });
        });
    </script>
