<script>
        // Simple interaction for the checkbox stamp
        document.querySelector('input[type="checkbox"]').addEventListener('change', function(e) {
            const stamp = document.querySelector('.check-stamp');
            if(e.target.checked) {
                stamp.classList.remove('hidden');
                stamp.classList.add('text-[#f59e0b]');
                e.target.parentElement.classList.add('border-[#f59e0b]');
                e.target.parentElement.classList.remove('border-outline');
            } else {
                stamp.classList.add('hidden');
                stamp.classList.remove('text-[#f59e0b]');
                e.target.parentElement.classList.remove('border-[#f59e0b]');
                e.target.parentElement.classList.add('border-outline');
            }
        });
    </script>
